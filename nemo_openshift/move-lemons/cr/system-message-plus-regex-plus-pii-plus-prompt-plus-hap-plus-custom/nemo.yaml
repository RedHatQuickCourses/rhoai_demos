apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: lemonade
spec:
  nemoConfigs:
    - name: lemonade-stand
      default: true
      configMaps:
        - lemonade-config
  env:
    - name: LLM_API_KEY
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: api-key
    - name: INJECTION_GUARD_API_KEY
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: injection-guard-api-key
    - name: HAP_GUARD_API_KEY
      valueFrom:
        secretKeyRef:
          name: lemonade-secret
          key: hap-guard-api-key